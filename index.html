<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101013">
<title>自由畫板 Atelier</title>
<style>
:root{
  --bg0:#101013;          /* 頁面底 */
  --bg1:#17171c;          /* 面板 */
  --bg2:#1f1f26;          /* 浮起元素 */
  --bg3:#26262e;          /* hover */
  --line:#2c2c35;         /* 邊框 */
  --line2:#3a3a45;
  --txt:#e9e7e2;          /* 主文字 */
  --txt2:#9c9a93;         /* 次文字 */
  --gold:#c8a468;         /* 主要點綴 */
  --gold-soft:rgba(200,164,104,.14);
  --danger:#b8574a;
  --radius:10px;
  --shadow:0 6px 24px rgba(0,0,0,.45);
  --serif:"Noto Serif TC","Songti TC",serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:"Microsoft JhengHei","Segoe UI",system-ui,sans-serif;
  background:var(--bg0);color:var(--txt);
  display:flex;flex-direction:column;
  user-select:none;touch-action:manipulation;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
/* ── 頂部列 ── */
header{
  display:flex;align-items:center;gap:6px;
  padding:10px 16px;flex-wrap:wrap;
  background:var(--bg1);border-bottom:1px solid var(--line);z-index:20;
}
header h1{
  font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.14em;
  margin-right:14px;white-space:nowrap;color:var(--txt);
}
header h1 em{font-style:normal;color:var(--gold);font-size:11px;letter-spacing:.3em;margin-left:8px;vertical-align:2px}
.hbtn{
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--line);border-radius:8px;padding:8px 13px;
  font-size:13px;font-weight:600;letter-spacing:.05em;
  cursor:pointer;color:var(--txt2);background:transparent;white-space:nowrap;
  transition:color .15s,border-color .15s,background .15s;font-family:inherit;
}
.hbtn svg{width:16px;height:16px}
.hbtn:hover{color:var(--txt);border-color:var(--line2);background:var(--bg2)}
.hbtn:active{background:var(--bg3)}
.hbtn:disabled{opacity:.3;cursor:default}
.hbtn.primary{color:var(--gold);border-color:rgba(200,164,104,.4)}
.hbtn.primary:hover{background:var(--gold-soft);border-color:var(--gold)}
.spacer{flex:1}
/* ── 主區 ── */
main{flex:1;display:flex;min-height:0}
/* 左側工具列 */
#toolbar{
  width:72px;display:flex;flex-direction:column;gap:2px;align-items:center;
  padding:10px 8px;overflow-y:auto;z-index:10;
  background:var(--bg1);border-right:1px solid var(--line);
}
.tool{
  width:56px;border:1px solid transparent;border-radius:var(--radius);
  background:transparent;cursor:pointer;color:var(--txt2);
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 6px;
  transition:color .15s,background .15s,border-color .15s;font-family:inherit;
}
.tool .ico{display:flex}
.tool .ico svg{width:21px;height:21px}
.tool .lbl{font-size:10px;letter-spacing:.08em;font-weight:600}
.tool:hover{color:var(--txt);background:var(--bg2)}
.tool.active{color:var(--gold);background:var(--gold-soft);border-color:rgba(200,164,104,.35)}
.tool.toggled{color:var(--gold);border-color:rgba(200,164,104,.35)}
/* 畫布 */
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;padding:14px;overflow:auto;
  background:radial-gradient(ellipse at 50% 40%,#1a1a20 0%,var(--bg0) 75%)}
#stage.zoomed{align-items:flex-start;justify-content:flex-start}
#canvasWrap{position:relative;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px var(--line2);border-radius:4px;overflow:hidden}
#board{display:block;background:#ffffff;touch-action:none;cursor:crosshair}
/* ── 底部調色盤 ── */
#bottombar{
  display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap;
  background:var(--bg1);border-top:1px solid var(--line);z-index:20;
}
#palette{display:flex;gap:6px;flex-wrap:wrap;max-width:640px}
.swatch{
  width:24px;height:24px;border-radius:50%;cursor:pointer;
  border:1px solid rgba(255,255,255,.14);transition:transform .12s,box-shadow .12s;
}
.swatch:hover{transform:scale(1.15)}
.swatch.active{transform:scale(1.2);box-shadow:0 0 0 2px var(--bg1),0 0 0 3.5px var(--gold)}
#customColor{width:30px;height:30px;border:1px solid var(--line2);border-radius:50%;cursor:pointer;padding:0;background:none}
.sizebox{display:flex;align-items:center;gap:8px}
.sizebox label{font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--txt2);white-space:nowrap}
input[type=range]{appearance:none;-webkit-appearance:none;height:3px;border-radius:2px;background:var(--line2);cursor:pointer}
input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--gold);border:none}
#sizeSlider{width:130px}
#sizeDot{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
#sizeDot i{display:block;border-radius:50%;background:#e9e7e2;box-shadow:0 0 0 1px var(--line2)}
#paperBox{display:flex;gap:5px;align-items:center}
#paperBox span{font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--txt2)}
.paper{width:20px;height:20px;border-radius:5px;border:1px solid var(--line2);cursor:pointer;transition:box-shadow .12s}
.paper.active{box-shadow:0 0 0 2px var(--bg1),0 0 0 3.5px var(--gold)}
/* ── 抽屜面板 ── */
.drawer{
  position:fixed;inset:0;background:rgba(6,6,9,.72);backdrop-filter:blur(3px);z-index:50;
  display:none;align-items:center;justify-content:center;
}
.drawer.open{display:flex}
.drawer .panel{
  background:var(--bg1);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);
  width:min(760px,94vw);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;
}
.panel .phead{
  display:flex;align-items:center;padding:16px 20px 12px;gap:12px;
  border-bottom:1px solid var(--line);
}
.panel .phead h2{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.08em;color:var(--txt);flex:1}
.closeBtn{border:1px solid var(--line);background:transparent;border-radius:50%;width:44px;height:44px;font-size:16px;cursor:pointer;color:var(--txt2);flex-shrink:0;transition:color .15s,border-color .15s}
.closeBtn:hover{color:var(--txt);border-color:var(--line2)}
.panel .pbody{overflow-y:auto;padding:16px 20px}
/* 分類頁籤 */
#stampTabs,#colorTabs{display:flex;gap:8px;padding:12px 20px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.stab{border:1px solid var(--line);border-radius:999px;padding:8px 16px;min-height:40px;font-size:13px;font-weight:600;letter-spacing:.04em;cursor:pointer;background:transparent;color:var(--txt2);font-family:inherit;transition:all .15s}
.stab:hover{color:var(--txt);border-color:var(--line2)}
.stab.active{background:var(--gold-soft);color:var(--gold);border-color:rgba(200,164,104,.45)}
/* 印章 */
#stampGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.stampBtn{border:1px solid transparent;background:var(--bg2);border-radius:10px;font-size:29px;padding:7px 0;cursor:pointer;line-height:1.2;transition:background .12s,border-color .12s}
.stampBtn:hover{background:var(--bg3)}
.stampBtn.active{border-color:var(--gold);background:var(--gold-soft)}
/* 著色本 */
#pageGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
#photoPanel{display:none;flex-direction:column;gap:12px;margin-bottom:14px}
#photoPanel.show{display:flex}
#photoPanel .photoHint{font-size:13px;color:var(--txt2);line-height:1.8;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
#photoPanel .photoHint b{color:var(--gold);font-weight:600}
.photoRow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.photoRow label{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--txt2);display:flex;align-items:center;gap:8px}
.photoRow input[type=range]{width:120px}
#photoPreview{width:100%;max-width:600px;border:1px solid var(--line2);border-radius:8px;align-self:center;background:#fff}
.pageCard{border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:var(--bg2);text-align:center;transition:border-color .15s,transform .15s;font-family:inherit;padding:0}
.pageCard:hover{transform:translateY(-2px);border-color:var(--gold)}
.pageCard canvas{width:100%;display:block;background:#fff}
.pageCard .pname{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--txt2);padding:8px 6px}
.pageCard .emThumb{width:100%;aspect-ratio:3/2;display:flex;align-items:center;justify-content:center;font-size:56px;background:#fff;filter:grayscale(1) opacity(.25)}
/* 作品集 */
#galleryGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.workCard{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg2);position:relative;transition:border-color .15s}
.workCard:hover{border-color:var(--line2)}
.workCard img{width:100%;display:block;cursor:pointer}
.workCard .del{position:absolute;top:8px;right:8px;border:none;background:rgba(16,16,19,.8);color:var(--txt2);border-radius:50%;width:28px;height:28px;cursor:pointer;font-weight:700;transition:color .15s,background .15s}
.workCard .del:hover{background:var(--danger);color:#fff}
#galleryEmpty{color:var(--txt2);font-size:14px;text-align:center;padding:36px 0;letter-spacing:.05em}
/* 提示 */
#toast{
  position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(16px);
  background:var(--bg2);color:var(--txt);border:1px solid rgba(200,164,104,.4);
  padding:11px 22px;border-radius:8px;font-size:13px;letter-spacing:.04em;
  opacity:0;pointer-events:none;transition:all .25s;z-index:99;white-space:nowrap;
  box-shadow:var(--shadow);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:640px){
  header{padding:8px 10px}
  header h1{font-size:15px;margin-right:6px}
  header h1 em{display:none}
  .hbtn{padding:7px 10px;font-size:12px}
  .hbtn .btxt{display:none}
  #toolbar{width:60px}
  .tool{width:50px}
  .tool .ico svg{width:19px;height:19px}
}
</style>
</head>
<body>

<header>
  <h1>自由畫板<em>ATELIER</em></h1>
  <button class="hbtn primary" id="btnStamps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="4"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/><path d="M8 14.5l2.8 6H5.2l2.8-6z"/></svg><span class="btxt">圖章</span></button>
  <button class="hbtn primary" id="btnColoring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-2-1.4-4.6-2-8-2v14c3.4 0 6 .6 8 2 2-1.4 4.6-2 8-2V4c-3.4 0-6 .6-8 2z"/><path d="M12 6v14"/></svg><span class="btxt">著色本</span></button>
  <button class="hbtn primary" id="btnGallery"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-5 4 4 3-3 4 4"/></svg><span class="btxt">作品集</span></button>
  <span class="spacer"></span>
  <button class="hbtn" id="btnUndo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v4"/></svg><span class="btxt">復原</span></button>
  <button class="hbtn" id="btnRedo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0-6 6v4"/></svg><span class="btxt">重做</span></button>
  <button class="hbtn" id="btnClear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v5M14 11v5"/></svg><span class="btxt">清除</span></button>
  <button class="hbtn" id="btnSave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg><span class="btxt">存檔</span></button>
</header>

<main>
  <div id="toolbar"></div>
  <div id="stage">
    <div id="canvasWrap"><canvas id="board" width="1200" height="800"></canvas></div>
  </div>
</main>

<div id="bottombar">
  <div class="sizebox">
    <label>粗細</label>
    <input type="range" id="sizeSlider" min="3" max="80" value="14">
    <span id="sizeDot"><i></i></span>
  </div>
  <div id="palette"></div>
  <input type="color" id="customColor" value="#7c4dff" title="自訂顏色">
  <div id="paperBox"><span>畫紙</span></div>
</div>

<!-- 印章抽屜 -->
<div class="drawer" id="stampDrawer">
  <div class="panel">
    <div class="phead"><h2>圖章庫 — 點選圖案後，在畫布上按一下蓋章</h2><button class="closeBtn" data-close="stampDrawer">✕</button></div>
    <div id="stampTabs"></div>
    <div class="pbody"><div id="stampGrid"></div></div>
  </div>
</div>

<!-- 著色本抽屜 -->
<div class="drawer" id="coloringDrawer">
  <div class="panel">
    <div class="phead"><h2 id="coloringTitle">著色本 — 選擇線稿，以油漆桶上色</h2><button class="closeBtn" data-close="coloringDrawer">✕</button></div>
    <div id="colorTabs"></div>
    <div class="pbody">
      <div id="photoPanel">
        <div class="photoHint">將照片轉為黑白線稿著色圖。選擇照片、調整線條細節，按「放到畫布」即可開始上色。照片僅在本機處理，<b>不會上傳至網路</b>。</div>
        <input type="file" id="photoInput" accept="image/*" hidden>
        <div class="photoRow"><button class="hbtn primary" id="photoPick">選擇照片</button></div>
        <div id="photoEditor" style="display:none">
          <canvas id="photoPreview" width="600" height="400"></canvas>
          <div class="photoRow" style="margin-top:10px">
            <label>線條細節 <input type="range" id="photoDetail" min="20" max="130" value="75"></label>
            <label>線條粗細 <input type="range" id="photoThick" min="0" max="3" value="1"></label>
            <button class="hbtn primary" id="photoApply">放到畫布</button>
          </div>
        </div>
      </div>
      <div id="pageGrid"></div>
    </div>
  </div>
</div>

<!-- 作品集抽屜 -->
<div class="drawer" id="galleryDrawer">
  <div class="panel">
    <div class="phead"><h2>作品集</h2><button class="hbtn primary" id="btnSaveToGallery">＋ 收藏目前畫作</button><button class="closeBtn" data-close="galleryDrawer">✕</button></div>
    <div class="pbody"><div id="galleryGrid"></div><div id="galleryEmpty" style="display:none">尚無收藏的作品 — 完成畫作後按「收藏目前畫作」。</div></div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
/* ══════════════ 基本設定 ══════════════ */
const W = 1200, H = 800;
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d", { willReadFrequently: true });

const state = {
  tool: "pen",          // pen | marker | crayon | spray | rainbow | glitter | glow | eraser | bucket | stamp
  color: "#e74c3c",
  size: 14,
  stamp: "🐶",
  mirror: false,
  paper: "#ffffff",
  hue: 0,
};

/* ══════════════ 工具列 ══════════════ */
const svgIcon = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICONS = {
  pen:     svgIcon('<path d="M4 20l1.2-4.2L16 5l3 3L8.2 18.8 4 20z"/><path d="M13.5 7.5l3 3"/>'),
  marker:  svgIcon('<path d="M9 3h6v7l2 3v8H7v-8l2-3V3z"/><path d="M9 10h6"/>'),
  crayon:  svgIcon('<path d="M8 21V9.5L12 3l4 6.5V21H8z"/><path d="M8 13h8"/>'),
  spray:   svgIcon('<rect x="7" y="9" width="9" height="12" rx="1.5"/><path d="M9.5 9V6h4v3"/><path d="M18.5 4h.01M21 7h.01M18.5 10h.01M21 12.5h.01"/>'),
  rainbow: svgIcon('<path d="M4 17a8 8 0 0 1 16 0"/><path d="M8.5 17a3.5 3.5 0 0 1 7 0"/>'),
  glitter: svgIcon('<path d="M11 4l1.6 4.4L17 10l-4.4 1.6L11 16l-1.6-4.4L5 10l4.4-1.6L11 4z"/><path d="M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8L18 15z"/>'),
  glow:    svgIcon('<circle cx="12" cy="12" r="4"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.9 5.9l1.8 1.8M16.3 16.3l1.8 1.8M18.1 5.9l-1.8 1.8M7.7 16.3l-1.8 1.8"/>'),
  bucket:  svgIcon('<path d="M5 12l7-7 7 7-7 7-7-7z"/><path d="M5 12h14"/><path d="M20 17.2c0 1.3-.8 2.3-1.8 2.3s-1.8-1-1.8-2.3 1.8-3.2 1.8-3.2 1.8 1.9 1.8 3.2z"/>'),
  stamp:   svgIcon('<path d="M9 4h6v4.5a3 3 0 0 1-1 2.5h4a2 2 0 0 1 2 2v3H4v-3a2 2 0 0 1 2-2h4a3 3 0 0 1-1-2.5V4z"/><path d="M5 20h14"/>'),
  eraser:  svgIcon('<path d="M14.5 4.5l5 5L10 19H6.5l-3-3 11-11z"/><path d="M8.5 10.5l5 5"/><path d="M13 20h8"/>'),
  hand:    svgIcon('<path d="M12 3v18M3 12h18"/><path d="M12 3l-2.2 2.2M12 3l2.2 2.2M12 21l-2.2-2.2M12 21l2.2-2.2M3 12l2.2-2.2M3 12l2.2 2.2M21 12l-2.2-2.2M21 12l-2.2 2.2"/>'),
  mirror:  svgIcon('<path d="M12 3v18" stroke-dasharray="2.5 3"/><path d="M8 8l-4 4 4 4M16 8l4 4-4 4"/>'),
  zoom:    svgIcon('<circle cx="11" cy="11" r="6"/><path d="M15.5 15.5L21 21"/><path d="M11 8.5v5M8.5 11h5"/>'),
};
const TOOLS = [
  { id:"pen",     lbl:"鉛筆" },
  { id:"marker",  lbl:"麥克筆" },
  { id:"crayon",  lbl:"蠟筆" },
  { id:"spray",   lbl:"噴槍" },
  { id:"rainbow", lbl:"彩虹筆" },
  { id:"glitter", lbl:"亮粉筆" },
  { id:"glow",    lbl:"螢光筆" },
  { id:"bucket",  lbl:"油漆桶" },
  { id:"stamp",   lbl:"圖章" },
  { id:"eraser",  lbl:"橡皮擦" },
  { id:"hand",    lbl:"移動" },
];
const toolbar = document.getElementById("toolbar");
TOOLS.forEach(t => {
  const b = document.createElement("button");
  b.className = "tool"; b.dataset.tool = t.id;
  b.innerHTML = `<span class="ico">${ICONS[t.id]}</span><span class="lbl">${t.lbl}</span>`;
  b.addEventListener("click", () => setTool(t.id));
  toolbar.appendChild(b);
});
// 對稱開關（獨立切換鈕）
const mirrorBtn = document.createElement("button");
mirrorBtn.className = "tool"; mirrorBtn.id = "mirrorBtn";
mirrorBtn.innerHTML = `<span class="ico">${ICONS.mirror}</span><span class="lbl">對稱</span>`;
mirrorBtn.addEventListener("click", () => {
  state.mirror = !state.mirror;
  mirrorBtn.classList.toggle("toggled", state.mirror);
  toast(state.mirror ? "對稱模式：開" : "對稱模式：關");
});
toolbar.appendChild(mirrorBtn);
// 放大鏡：小區域好點（搭配「✋移動」拖動畫布）
let zoomFactor = 1;
const ZOOMS = [1, 1.6, 2.4];
const zoomBtn = document.createElement("button");
zoomBtn.className = "tool"; zoomBtn.id = "zoomBtn";
zoomBtn.innerHTML = `<span class="ico">${ICONS.zoom}</span><span class="lbl">放大</span>`;
zoomBtn.addEventListener("click", () => {
  zoomFactor = ZOOMS[(ZOOMS.indexOf(zoomFactor) + 1) % ZOOMS.length];
  const stage = document.getElementById("stage");
  stage.classList.toggle("zoomed", zoomFactor > 1);

/* ══════════════ 復原 / 重做 ══════════════ */
const undoStack = [], redoStack = [], MAX_UNDO = 15;
// 快照用離屏 canvas（drawImage 是 GPU 端複製，~1-4ms）；toDataURL 的同步 PNG 編碼
// 每次下筆會卡 50-250ms，且非同步 Image 還原在快按復原時會產生競態
function snapshotCanvas() {
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  c.getContext("2d").drawImage(canvas, 0, 0);
  return c;
}
function pushUndo(snap) {
  undoStack.push(snap || snapshotCanvas());
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  redoStack.length = 0;
  refreshHistoryBtns();
}
function restore(snap) {
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(snap, 0, 0);
}
function doUndo() {
  if (!undoStack.length) return;
  redoStack.push(snapshotCanvas());
  restore(undoStack.pop());
  refreshHistoryBtns();
}
function doRedo() {
  if (!redoStack.length) return;
  undoStack.push(snapshotCanvas());
  restore(redoStack.pop());
  refreshHistoryBtns();
}
function refreshHistoryBtns() {
  document.getElementById("btnUndo").disabled = !undoStack.length;
  document.getElementById("btnRedo").disabled = !redoStack.length;
}
document.getElementById("btnUndo").addEventListener("click", doUndo);
document.getElementById("btnRedo").addEventListener("click", doRedo);
document.getElementById("btnClear").addEventListener("click", () => {
  pushUndo();
  ctx.clearRect(0,0,W,H);
  toast("畫布已清除（按復原可還原）");
});

/* ══════════════ 筆刷實作 ══════════════ */
let drawing = false, lastX = 0, lastY = 0, sprayTimer = null, panning = null;

function canvasPos(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (W / r.width),
    y: (e.clientY - r.top)  * (H / r.height),
  };
}

function strokeSegment(x0, y0, x1, y1) {
  drawBrushSegment(x0, y0, x1, y1);
  if (state.mirror) drawBrushSegment(W - x0, y0, W - x1, y1);
}

function drawBrushSegment(x0, y0, x1, y1) {
  const s = state.size;
  ctx.save();
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  switch (state.tool) {
    case "pen":
      ctx.strokeStyle = state.color; ctx.lineWidth = Math.max(2, s * 0.45);
      line(x0,y0,x1,y1); break;
    case "marker":
      ctx.strokeStyle = state.color; ctx.lineWidth = s * 1.4;
      line(x0,y0,x1,y1); break;
    case "crayon":
      ctx.globalAlpha = 0.32; ctx.strokeStyle = state.color; ctx.lineWidth = s;
      for (let i = 0; i < 3; i++) {
        const j = () => (Math.random() - 0.5) * s * 0.5;
        line(x0 + j(), y0 + j(), x1 + j(), y1 + j());
      }
      break;
    case "spray": {
      ctx.fillStyle = state.color; ctx.globalAlpha = 0.75;
      const R = s * 1.4, n = Math.ceil(s * 1.2);
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, r = Math.random() * R;
        ctx.beginPath();
        ctx.arc(x1 + Math.cos(a)*r, y1 + Math.sin(a)*r, 1 + Math.random()*1.5, 0, 7);
        ctx.fill();
      }
      break;
    }
    case "rainbow":
      state.hue = (state.hue + 5) % 360;
      ctx.strokeStyle = `hsl(${state.hue},95%,55%)`; ctx.lineWidth = s * 1.2;
      line(x0,y0,x1,y1); break;
    case "glitter": {
      const dist = Math.hypot(x1-x0, y1-y0) || 1;
      const steps = Math.max(1, Math.floor(dist / 6));
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const gx = x0 + (x1-x0)*t + (Math.random()-0.5)*s;
        const gy = y0 + (y1-y0)*t + (Math.random()-0.5)*s;
        drawStar(gx, gy, 1.5 + Math.random() * s * 0.22,
          Math.random() < 0.4 ? "#ffffff" : `hsl(${Math.random()*360},90%,65%)`);
      }
      break;
    }
    case "glow":
      ctx.shadowColor = state.color; ctx.shadowBlur = s * 1.2;
      ctx.strokeStyle = state.color; ctx.lineWidth = s * 0.55;
      line(x0,y0,x1,y1); break;
    case "eraser":
      ctx.globalCompositeOperation = "destination-out";
      ctx.strokeStyle = "#000"; ctx.lineWidth = s * 2;
      line(x0,y0,x1,y1); break;
  }
  ctx.restore();
}
function line(x0,y0,x1,y1){ ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke(); }
function drawStar(x, y, r, color) {
  ctx.save(); ctx.fillStyle = color; ctx.translate(x, y);
  ctx.rotate(Math.random() * Math.PI);
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const rr = i % 2 ? r * 0.4 : r;
    const a = (i / 8) * Math.PI * 2;
    ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

/* ══════════════ 油漆桶（掃描線填色） ══════════════ */
function floodFill(sx, sy, fillColor) {
  sx = Math.round(sx); sy = Math.round(sy);
  if (sx < 0 || sy < 0 || sx >= W || sy >= H) return false;
  const img = ctx.getImageData(0, 0, W, H);
  const d = img.data;
  const idx = (x, y) => (y * W + x) * 4;
  // 小朋友常點到黑色輪廓線上：往外找最近的非線條像素當起點（找不到就照原點填，仍可填深色區）
  const isLine = i => d[i+3] > 200 && Math.max(d[i], d[i+1], d[i+2]) < 80;
  if (isLine(idx(sx, sy))) {
    let fx = -1, fy = -1;
    outer:
    for (let r = 1; r <= 8; r++) {
      for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
          if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
          const nx = sx + dx, ny = sy + dy;
          if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
          if (!isLine(idx(nx, ny))) { fx = nx; fy = ny; break outer; }
        }
      }
    }
    if (fx >= 0) { sx = fx; sy = fy; }
  }
  const i0 = idx(sx, sy);
  const tr = d[i0], tg = d[i0+1], tb = d[i0+2], ta = d[i0+3];
  const [fr, fg, fb] = hexToRgb(fillColor);
  const TOL = 60 * 60; // 容差（處理反鋸齒邊緣）
  const match = i => {
    const dr = d[i]-tr, dg = d[i+1]-tg, db = d[i+2]-tb, da = d[i+3]-ta;
    return dr*dr + dg*dg + db*db + da*da*0.6 <= TOL;
  };
  // 目標色與填色相同就不用填
  if (ta === 255 && tr === fr && tg === fg && tb === fb) return false;
  const stack = [[sx, sy]];
  const seen = new Uint8Array(W * H);
  let painted = 0;
  while (stack.length) {
    const [px, py] = stack.pop();
    let x = px;
    while (x >= 0 && !seen[py*W + x] && match(idx(x, py))) x--;
    x++;
    let up = false, down = false;
    while (x < W && !seen[py*W + x] && match(idx(x, py))) {
      const i = idx(x, py);
      d[i] = fr; d[i+1] = fg; d[i+2] = fb; d[i+3] = 255;
      seen[py*W + x] = 1; painted++;
      if (py > 0)   { const m = match(idx(x, py-1)) && !seen[(py-1)*W+x]; if (m && !up) { stack.push([x, py-1]); up = true; } if (!m) up = false; }
      if (py < H-1) { const m = match(idx(x, py+1)) && !seen[(py+1)*W+x]; if (m && !down) { stack.push([x, py+1]); down = true; } if (!m) down = false; }
      x++;
    }
  }
  if (painted) ctx.putImageData(img, 0, 0);
  return painted > 0;
}
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

/* ══════════════ 印章 ══════════════ */
function placeStamp(x, y) {
  const size = Math.min(300, Math.max(28, state.size * 3.2));
  ctx.save();
  ctx.font = `${size}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(state.stamp, x, y);
  if (state.mirror) ctx.fillText(state.stamp, W - x, y);
  ctx.restore();
}

function withOutline(c, fn) {

  c.fillStyle = "transparent";

const P = { // 繪圖小工具（座標以 1200x800 為準）
  circle(c,x,y,r){ c.beginPath(); c.arc(x,y,r,0,7); c.stroke(); },
  ellipse(c,x,y,rx,ry,rot=0){ c.beginPath(); c.ellipse(x,y,rx,ry,rot,0,7); c.stroke(); },
  poly(c,pts,close=true){ c.beginPath(); c.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]); if(close)c.closePath(); c.stroke(); },
  seg(c,x0,y0,x1,y1){ c.beginPath(); c.moveTo(x0,y0); c.lineTo(x1,y1); c.stroke(); },
  dot(c,x,y,r=10){ c.beginPath(); c.arc(x,y,r,0,7); c.save(); c.fillStyle="#222"; c.fill(); c.restore(); },
  arc(c,x,y,r,a0,a1){ c.beginPath(); c.arc(x,y,r,a0,a1); c.stroke(); },
  curve(c,pts){ c.beginPath(); c.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length-1;i++){ const xc=(pts[i][0]+pts[i+1][0])/2, yc=(pts[i][1]+pts[i+1][1])/2; c.quadraticCurveTo(pts[i][0],pts[i][1],xc,yc);} c.stroke(); },
};

/* ══════════════ 線稿轉換引擎（彩圖 → 黑線白底著色圖） ══════════════ */
function boxBlur(a, w, h, r) {
  if (r <= 0) return;
  const tmp = new Float32Array(a.length);
  const div = 2 * r + 1;
  for (let y = 0; y < h; y++) {           // 水平
    let sum = 0; const row = y * w;
    for (let x = -r; x <= r; x++) sum += a[row + Math.min(w - 1, Math.max(0, x))];
    for (let x = 0; x < w; x++) {
      tmp[row + x] = sum / div;
      sum += a[row + Math.min(w - 1, x + r + 1)] - a[row + Math.max(0, x - r)];
    }
  }
  for (let x = 0; x < w; x++) {           // 垂直
    let sum = 0;
    for (let y = -r; y <= r; y++) sum += tmp[Math.min(h - 1, Math.max(0, y)) * w + x];
    for (let y = 0; y < h; y++) {
      a[y * w + x] = sum / div;
      sum += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x];
    }
  }
}
function dilateMask(mask, w, h, r) {
  const out = new Uint8Array(mask.length);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (!mask[y * w + x]) continue;
    for (let dy = -r; dy <= r; dy++) {
      const yy = y + dy; if (yy < 0 || yy >= h) continue;
      for (let dx = -r; dx <= r; dx++) {
        const xx = x + dx; if (xx < 0 || xx >= w) continue;
        out[yy * w + xx] = 1;
      }
    }
  }
  return out;
}
// mode: "flat"=卡通色塊邊界（emoji 用）；"photo"=灰階+模糊+Sobel（照片用）
function toLineArt(srcCanvas, mode, opts = {}) {
  const w = srcCanvas.width, h = srcCanvas.height;
  const src = srcCanvas.getContext("2d").getImageData(0, 0, w, h).data;
  let edge = new Uint8Array(w * h);
  if (mode === "flat") {
    const tol = opts.tol == null ? 40 : opts.tol, T2 = tol * tol;
    const d2 = (i, j) => {
      const dr = src[i]-src[j], dg = src[i+1]-src[j+1], db = src[i+2]-src[j+2];
      return dr*dr + dg*dg + db*db;
    };
    for (let y = 0; y < h - 1; y++) {
      let i = y * w;
      for (let x = 0; x < w - 1; x++, i++) {
        const p = i * 4;
        if (d2(p, p + 4) > T2 || d2(p, p + w * 4) > T2) edge[i] = 1;
      }
    }
  } else {
    const gray = new Float32Array(w * h);
    for (let i = 0, p = 0; i < w * h; i++, p += 4)
      gray[i] = src[p] * 0.299 + src[p+1] * 0.587 + src[p+2] * 0.114;
    boxBlur(gray, w, h, opts.blur == null ? 2 : opts.blur);
    const thr = opts.threshold == null ? 70 : opts.threshold;
    const T2 = thr * thr;
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      const gx = -gray[i-w-1] - 2*gray[i-1] - gray[i+w-1] + gray[i-w+1] + 2*gray[i+1] + gray[i+w+1];
      const gy = -gray[i-w-1] - 2*gray[i-w] - gray[i-w+1] + gray[i+w-1] + 2*gray[i+w] + gray[i+w+1];
      if (gx*gx + gy*gy > T2) edge[i] = 1;
    }
  }
  const r = opts.dilate == null ? 1 : opts.dilate;
  if (r > 0) edge = dilateMask(edge, w, h, r);
  const out = document.createElement("canvas");
  out.width = w; out.height = h;
  const octx = out.getContext("2d");
  const im = octx.createImageData(w, h);
  const D = im.data;
  for (let i = 0, p = 0; i < w * h; i++, p += 4) {
    const v = edge[i] ? 34 : 255;
    D[p] = D[p+1] = D[p+2] = v; D[p+3] = 255;
  }
  octx.putImageData(im, 0, 0);
  return out;
}
function renderEmojiCanvas(emoji, w, h) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const x = c.getContext("2d", { willReadFrequently: true });
  x.fillStyle = "#ffffff"; x.fillRect(0, 0, w, h);
  x.font = `${Math.floor(h * 0.72)}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
  x.textAlign = "center"; x.textBaseline = "middle";
  x.fillText(emoji, w / 2, h / 2 + h * 0.03);
  return c;
}
function emojiColoringPage(emoji, w = W, h = H, dilate = 2) {
  return toLineArt(renderEmojiCanvas(emoji, w, h), "flat", { tol: 40, dilate });
}

/* 縮圖生成泵：emoji 字型光柵化很貴（~20ms/張），用 MessageChannel 微任務分批做
   （隱藏分頁也不會像 setTimeout 一樣被節流），每輪 ≤40ms 保持介面流暢 */
const thumbQueue = [];
let thumbPumping = false;
const thumbChannel = new MessageChannel();
thumbChannel.port1.onmessage = () => {
  thumbPumping = false;
  const start = performance.now();
  while (thumbQueue.length && performance.now() - start < 24) {
    const job = thumbQueue.shift();
    if (!thumbCache.has(job.em)) thumbCache.set(job.em, emojiColoringPage(job.em, 180, 120, 1));
    if (job.apply) job.apply();
  }
  if (thumbQueue.length) pumpThumbs();
};
function pumpThumbs() {
  if (thumbPumping) return;
  thumbPumping = true;
  thumbChannel.port2.postMessage(0);
}
function queueThumb(em, apply) {
  if (apply) thumbQueue.unshift({ em, apply }); // 畫面上的卡片插隊，背景預熱排後面
  else thumbQueue.push({ em });
  pumpThumbs();
}
function loadColoringPage(i) {
  pushUndo();
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,W,H); // 著色底一律白色
  PAGES[i].draw(ctx);
  ctx.restore();
  closeDrawer("coloringDrawer");
  setTool("bucket");
  toast(`已載入「${PAGES[i].name}」— 以油漆桶上色（按復原可還原）`);
}
function loadEmojiPage(em) {
  pushUndo();
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(emojiColoringPage(em, W, H, 2), 0, 0);
  closeDrawer("coloringDrawer");
  setTool("bucket");
  toast(`線稿已載入 — 以油漆桶上色（按復原可還原）`);
}

function fitImageToCanvas(img, w, h) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const x = c.getContext("2d", { willReadFrequently: true });
  x.fillStyle = "#ffffff"; x.fillRect(0, 0, w, h);
  const s = Math.min(w / img.naturalWidth, h / img.naturalHeight);
  const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
  x.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
  return c;
}
function photoParams() {

    threshold: 150 - (+document.getElementById("photoDetail").value),
    dilate: +document.getElementById("photoThick").value,

  };
}
// 滑桿拖曳時 input 事件連發，用旗標+短計時器合併，最後一次一定會以最新滑桿值重算
let photoPreviewQueued = false;
function updatePhotoPreview() {
  if (!photoSrc || photoPreviewQueued) return;

    photoPreviewQueued = false;

  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    URL.revokeObjectURL(url);
    if (!img.naturalWidth || !img.naturalHeight) { toast("這張圖片打不開，換一張試試"); return; }
    photoSrc = fitImageToCanvas(img, PHOTO_W, PHOTO_H);
    document.getElementById("photoEditor").style.display = "block";
    updatePhotoPreview();
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast("這張圖片打不開，換一張試試"); };
  img.src = url;
  e.target.value = ""; // 同一張可重選
});
document.getElementById("photoDetail").addEventListener("input", updatePhotoPreview);
document.getElementById("photoThick").addEventListener("input", updatePhotoPreview);
document.getElementById("photoApply").addEventListener("click", () => {
  if (!photoSrc) return;
  pushUndo();
  const art = toLineArt(photoSrc, "photo", photoParams());
  ctx.save();
  ctx.imageSmoothingEnabled = false; // 放大 2 倍保持線條銳利，填色才不會漏
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(art, 0, 0, W, H);
  ctx.restore();
  closeDrawer("coloringDrawer");
  setTool("bucket");
  toast("照片線稿已載入（按復原可還原）");
});

/* ══════════════ 畫布事件 ══════════════ */
canvas.addEventListener("pointerdown", e => {
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  const { x, y } = canvasPos(e);
  if (state.tool === "hand") {
    const st = document.getElementById("stage");
    panning = { x: e.clientX, y: e.clientY, sl: st.scrollLeft, st: st.scrollTop };
    canvas.style.cursor = "grabbing";
    return;
  }
  if (state.tool === "bucket") {
    const before = snapshotCanvas(); // 先拍快照，填成功才進復原堆疊，無效點擊不清掉重做紀錄
    const ok = floodFill(x, y, state.color);
    if (state.mirror && ok) floodFill(W - x, y, state.color);
    if (ok) pushUndo(before);
    else toast("此處已是這個顏色 — 請換一個顏色或區域");
    return;
  }
  if (state.tool === "stamp") {
    pushUndo();
    placeStamp(x, y);
    return;
  }
  pushUndo();
  drawing = true; lastX = x; lastY = y;
  strokeSegment(x, y, x + 0.01, y + 0.01); // 點一下也要有點
  if (state.tool === "spray") {
    sprayTimer = setInterval(() => { if (drawing) strokeSegment(lastX, lastY, lastX, lastY); }, 40);
  }
});
canvas.addEventListener("pointermove", e => {
  if (panning) {
    const st = document.getElementById("stage");
    st.scrollLeft = panning.sl - (e.clientX - panning.x);
    st.scrollTop  = panning.st - (e.clientY - panning.y);
    return;
  }
  if (!drawing) return;
  const { x, y } = canvasPos(e);
  strokeSegment(lastX, lastY, x, y);
  lastX = x; lastY = y;
});
function endStroke() {
  drawing = false;
  if (panning) { panning = null; if (state.tool === "hand") canvas.style.cursor = "grab"; }
  if (sprayTimer) { clearInterval(sprayTimer); sprayTimer = null; }
}
canvas.addEventListener("pointerup", endStroke);
canvas.addEventListener("pointercancel", endStroke);

/* ══════════════ 存檔下載 ══════════════ */
function compositeCanvas(type = "image/png", q) {
  const tmp = document.createElement("canvas");
  tmp.width = W; tmp.height = H;
  const t = tmp.getContext("2d");
  t.fillStyle = state.paper; t.fillRect(0,0,W,H);
  t.drawImage(canvas, 0, 0);
  return tmp.toDataURL(type, q);
}
document.getElementById("btnSave").addEventListener("click", () => {
  const a = document.createElement("a");
  const d = new Date();
  a.download = `我的畫作-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}-${String(d.getHours()).padStart(2,"0")}${String(d.getMinutes()).padStart(2,"0")}.png`;
  a.href = compositeCanvas();
  a.click();
  toast("畫作已下載");
});

/* ══════════════ 作品集（localStorage） ══════════════ */
const GKEY = "freeboard.gallery.v1";
function loadGallery() { try { return JSON.parse(localStorage.getItem(GKEY)) || []; } catch { return []; } }
function saveGallery(list) {
  while (true) {
    try { localStorage.setItem(GKEY, JSON.stringify(list)); return true; }
    catch (e) {
      if (list.length === 0) return false;
      list.shift(); // 空間不足時淘汰最舊
      toast("空間不足，已移除最舊的作品");
    }
  }
}
function renderGallery() {
  const grid = document.getElementById("galleryGrid");
  const empty = document.getElementById("galleryEmpty");
  const list = loadGallery();
  grid.innerHTML = "";
  empty.style.display = list.length ? "none" : "block";
  list.slice().reverse().forEach(item => {
    const card = document.createElement("div");
    card.className = "workCard";
    const img = document.createElement("img");
    img.src = item.img; img.title = "點一下載入到畫布";
    img.addEventListener("click", () => {
      pushUndo();
      const im = new Image();
      im.onload = () => { ctx.clearRect(0,0,W,H); ctx.drawImage(im,0,0,W,H); };
      im.src = item.img;
      closeDrawer("galleryDrawer");
      toast("作品已載入（按復原可還原）");
    });
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "✕"; del.title = "刪除這張作品";
    del.addEventListener("click", () => {
      saveGallery(loadGallery().filter(x => x.id !== item.id));
      renderGallery();
    });
    card.appendChild(img); card.appendChild(del);
    grid.appendChild(card);
  });
}
document.getElementById("btnSaveToGallery").addEventListener("click", () => {
  const list = loadGallery();
  list.push({ id: Date.now(), img: compositeCanvas("image/jpeg", 0.72) });
  if (saveGallery(list)) toast("已收藏至作品集");
  renderGallery();
});

/* ══════════════ 抽屜開關 ══════════════ */
function openDrawer(id) {
  document.getElementById(id).classList.add("open");
  if (id === "stampDrawer") stampDrawerShown = true;
  if (id === "galleryDrawer") renderGallery();
  if (id === "coloringDrawer" && !coloringBuilt) {
    coloringBuilt = true;
    renderColoringTab();
    // 第一次打開著色本才開始預熱全部縮圖（畫面上的卡片會插隊優先）
    Object.keys(EMOJI_PAGE_SETS).forEach(k => EMOJI_PAGE_SETS[k].forEach(em => queueThumb(em)));
  }
}
function closeDrawer(id) { document.getElementById(id).classList.remove("open"); }
document.getElementById("btnStamps").addEventListener("click", () => openDrawer("stampDrawer"));
document.getElementById("btnColoring").addEventListener("click", () => openDrawer("coloringDrawer"));
document.getElementById("btnGallery").addEventListener("click", () => openDrawer("galleryDrawer"));
document.querySelectorAll(".closeBtn").forEach(b =>
  b.addEventListener("click", () => closeDrawer(b.dataset.close)));
document.querySelectorAll(".drawer").forEach(d =>
  d.addEventListener("click", e => { if (e.target === d) d.classList.remove("open"); }));

/* ══════════════ 提示 ══════════════ */
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ══════════════ 畫布縮放 ══════════════ */
function fitCanvas() {
  const stage = document.getElementById("stage");
  const pad = 16;
  const aw = stage.clientWidth - pad, ah = stage.clientHeight - pad;
  if (aw < 50 || ah < 50) return; // 版面尚未就緒（隱藏視窗載入時尺寸可能為 0）
  const scale = Math.min(aw / W, ah / H, 1.2) * zoomFactor;
  canvas.style.width = Math.floor(W * scale) + "px";
  canvas.style.height = Math.floor(H * scale) + "px";
}
window.addEventListener("resize", fitCanvas);
window.addEventListener("load", fitCanvas);
new ResizeObserver(fitCanvas).observe(document.getElementById("stage"));

/* ══════════════ 初始化 ══════════════ */
setTool("pen");
setColor("#e74c3c");
document.querySelector('.paper[data-paper="#ffffff"]').classList.add("active");
updateSizeDot();
refreshHistoryBtns();
fitCanvas();

// 匯出給自動化測試使用
window.__board = { state, floodFill, placeStamp, loadColoringPage, loadEmojiPage, emojiColoringPage, toLineArt, renderColoringTab, pushUndo, doUndo, doRedo, canvas, ctx, PAGES, STAMP_SETS, EMOJI_PAGE_SETS, TOTAL_PAGES };
</script>
